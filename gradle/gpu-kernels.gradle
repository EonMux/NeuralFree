tasks.register('compileMetalShaders') {
    group = 'build'
    description = 'Generates the kernel libraries\' Metal Shading Language sources from their SPIR-V modules (build/generated/gpu/metal)'
    def outRoot = gpuOut.map { it.dir('metal') }
    def toolSourceDir = new File(projectDir, 'gradle/metal-tool/src/main/java')
    // The SPIR-V modules, their index and the generator's sources and resolved toolchain decide the output.
    inputs.files(tasks.named('compileShaders')).withPropertyName('spirv').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree(toolSourceDir) { include '**/*.java' }).withPropertyName('generatorSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('libraries', gpuLibrariesFingerprint)
    inputs.property('spvc', providers.provider { gpuMetalToolFingerprint() })
    outputs.dir(outRoot)
    outputs.cacheIf(gpuCacheReason) { true }
    mustRunAfter 'updateKernelInventory'
    doLast { task ->
        File out = outRoot.get().asFile
        GpuBuildTools.resetDir(out)
        Map tool = gpuMetalTool()
        if (tool.error != null) {
            GpuBuildTools.missingTool(task.logger, gpuRequireShaders, 'neuralfree.requireShaders',
                    "SPIRV-Cross (org.lwjgl:lwjgl-spvc:${gpuSpvcVersion}) is unavailable, so the Metal kernel "
                            + "sources were not generated: ${tool.error}")
            return
        }
        File javac = new File(new File(System.getProperty('java.home'), 'bin'),
                GpuBuildTools.WINDOWS ? 'javac.exe' : 'javac')
        File java = new File(javac.parentFile, GpuBuildTools.WINDOWS ? 'java.exe' : 'java')
        if (!javac.isFile() || !java.isFile()) {
            GpuBuildTools.missingTool(task.logger, gpuRequireShaders, 'neuralfree.requireShaders',
                    "no javac/java under ${System.getProperty('java.home')}: Metal kernel sources not generated")
            return
        }
        File spvRoot = gpuOut.get().dir('spv').asFile
        if (!spvRoot.isDirectory()) {
            GpuBuildTools.missingTool(task.logger, gpuRequireShaders, 'neuralfree.requireShaders',
                    'the Vulkan shaders were not compiled: Metal kernel sources not generated')
            return
        }
        String jars = ((List<File>) tool.jars).collect { it.absolutePath }.join(File.pathSeparator)
        File classes = layout.buildDirectory.dir('tmp/metal-tool/classes').get().asFile
        GpuBuildTools.resetDir(classes)
        List<File> sources = GpuBuildTools.listFiles(toolSourceDir, '.java', [])
        List<Object> compile = [javac, '-d', classes.absolutePath, '-cp', jars]
        sources.each { File source -> compile.add(source.absolutePath) }
        GpuBuildTools.runChecked(compile, null, 'compiling the Metal shader generator')
        List<String> summary = []
        gpuLibraries.each { GpuKernelLibrary lib ->
            File spvDir = new File(spvRoot, lib.shaderRootPath)
            if (!new File(spvDir, 'index.properties').isFile()) {
                task.logger.warn("WARNING: ${lib.id} SPIR-V index is missing: Metal sources of ${lib.id} not generated")
                return
            }
            File metalDir = new File(out, lib.shaderRootPath + '/metal')
            List<Object> run = [java, '-cp', classes.absolutePath + File.pathSeparator + jars,
                                'neuralfree.gpu.metal.MetalShaderGenerator',
                                '--spv', spvDir.absolutePath, '--out', metalDir.absolutePath]
            GpuBuildTools.runChecked(run, null, "generating the Metal shaders of ${lib.id}")
            int count = (int) (metalDir.listFiles({ File f -> f.isFile() && f.name.endsWith('.metal') } as FileFilter)?.length ?: 0)
            summary.add("${lib.id} ${count} kernels")
        }
        task.logger.lifecycle("compileMetalShaders: ${summary.join(', ')}")
    }
}

/** The JNI headers of the running JDK that hipshim.c includes; absent when the JDK has no include tree. */
def gpuJniHeaders = { ->
    File include = new File(System.getProperty('java.home'), 'include')
    [new File(include, 'jni.h'), new File(include, 'linux/jni_md.h')].findAll { it.isFile() }
}

tasks.register('buildHipShim') {
    group = 'build'
    description = 'Builds the HIP JNI shim libhipshim.so from native/hip/hipshim.c (build/generated/gpu/hip-shim)'
    def outDir = gpuOut.map { it.dir('hip-shim') }
    inputs.file(file('native/hip/hipshim.c')).withPropertyName('shimSource').withPathSensitivity(PathSensitivity.RELATIVE)
    // The packed header changes the shim as much as the source does; the include directories stay relative.
    inputs.files(providers.provider { gpuJniHeaders() }).withPropertyName('jniHeaders').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('hipcc', providers.provider { GpuBuildTools.fingerprint(gpuFindHipcc()) })
    // hipcc reads its extra flags and compiler location from the environment, exactly as for the code objects.
    inputs.property('hipEnvironment', providers.provider {
        ['HIPCC_COMPILE_FLAGS_APPEND', 'HIP_CLANG_PATH']
                .collect { String name -> name + '=' + (System.getenv(name) ?: '') }.join('\n')
    })
    inputs.property('requireHip', gpuRequireHip)
    outputs.dir(outDir)
    outputs.cacheIf(gpuCacheReason) { true }
    doLast { task ->
        File out = outDir.get().asFile
        GpuBuildTools.resetDir(out)
        File hipcc = gpuFindHipcc()
        if (hipcc == null) {
            GpuBuildTools.missingTool(task.logger, gpuRequireHip, 'neuralfree.requireHip',
                    'hipcc not found: libhipshim.so not built; build it with native/hip/Makefile and point -Dneuralfree.hip.shim.path at it')
            return
        }
        File include = new File(System.getProperty('java.home'), 'include')
        File includeLinux = new File(include, 'linux')
        if (!new File(include, 'jni.h').isFile() || !new File(includeLinux, 'jni_md.h').isFile()) {
            task.logger.warn("WARNING: no JNI headers under ${include}: libhipshim.so not built (the shim needs a JDK's include tree)")
            return
        }
        File so = new File(out, 'libhipshim.so')
        GpuBuildTools.runChecked([hipcc, '-O2', '-fPIC', '-shared', '-Wall',
                                  '-I' + include.path, '-I' + includeLinux.path,
                                  file('native/hip/hipshim.c').path, '-o', so.path], null, 'building libhipshim.so')
        task.logger.lifecycle("buildHipShim: ${so} (run the engine with -Dneuralfree.hip.shim.path=${so})")
    }
}

tasks.register('buildMetalShim') {
    group = 'build'
    description = 'Builds the Metal JNI shim libmetalshim.dylib from native/metal/metalshim.m (build/generated/gpu/metal-shim; macOS only)'
    def outDir = gpuOut.map { it.dir('metal-shim') }
    inputs.file(file('native/metal/metalshim.m')).withPropertyName('shimSource').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(providers.provider { gpuJniHeaders() }).withPropertyName('jniHeaders').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('clang', providers.provider { GpuBuildTools.fingerprint(gpuFindClang()) })
    inputs.property('osName', providers.provider { System.getProperty('os.name') })
    inputs.property('requireMetal', gpuRequireMetal)
    outputs.dir(outDir)
    outputs.cacheIf(gpuCacheReason) { true }
    doLast { task ->
        File out = outDir.get().asFile
        GpuBuildTools.resetDir(out)
        String os = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
        if (!os.startsWith('mac')) {
            GpuBuildTools.missingTool(task.logger, gpuRequireMetal, 'neuralfree.requireMetal',
                    'Metal exists only on macOS: libmetalshim.dylib not built'.toString())
            return
        }
        File clang = gpuFindClang()
        if (clang == null) {
            GpuBuildTools.missingTool(task.logger, gpuRequireMetal, 'neuralfree.requireMetal',
                    'clang not found: libmetalshim.dylib not built')
            return
        }
        File include = new File(System.getProperty('java.home'), 'include')
        File includeDarwin = new File(include, 'darwin')
        if (!new File(include, 'jni.h').isFile() || !new File(includeDarwin, 'jni_md.h').isFile()) {
            task.logger.warn("WARNING: no JNI headers under ${include}: libmetalshim.dylib not built (the shim needs a JDK's include tree)")
            return
        }
        File dylib = new File(out, 'libmetalshim.dylib')
        GpuBuildTools.runChecked([clang, '-O2', '-fPIC', '-dynamiclib', '-fno-objc-arc', '-Wall',
                                  '-framework', 'Metal', '-framework', 'Foundation',
                                  '-I' + include.path, '-I' + includeDarwin.path,
                                  file('native/metal/metalshim.m').path, '-o', dylib.path], null,
                'building libmetalshim.dylib')
        task.logger.lifecycle("buildMetalShim: ${dylib} (run the engine with -Dneuralfree.metal.shim.path=${dylib})")
    }
}

tasks.register('checkOpenCLKernels') {
    group = 'verification'
    description = 'Syntax-checks the assembled OpenCL program of every kernel library with clang, plain and, for libraries with subgroup variants, with USE_SUBGROUPS'
    def stamp = gpuOut.map { it.file('check/opencl.stamp') }
    inputs.files(gpuKernelSources).withPropertyName('kernelSources').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(gpuSharedKernelSources).withPropertyName('sharedKernelSources').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('libraries', gpuLibrariesFingerprint)
    inputs.property('clang', providers.provider { GpuBuildTools.fingerprint(gpuFindClang()) })
    outputs.file(stamp)
    doLast { task ->
        File stampFile = stamp.get().asFile
        stampFile.delete()
        File clang = gpuFindClang()
        if (clang == null) {
            task.logger.warn('WARNING: clang not found: OpenCL kernel syntax check skipped')
            return
        }
        List<Object> base = [clang, '-x', 'cl', '-cl-std=CL1.2', '-Xclang', '-finclude-default-header', '-fsyntax-only']
        List<Callable<Object>> jobs = []
        List<String> checked = []
        gpuLibraries.each { GpuKernelLibrary lib ->
            File cl = new File(task.temporaryDir, "${lib.id}_kernels.cl")
            GpuBuildTools.writeText(cl, GpuKernelSources.concatenate(lib.manifest(gpuSharedKernelRoot).findAll { !it.cudaOnly }))
            List<List<String>> variants = lib.subgroupVariants ? [[], ['-DUSE_SUBGROUPS=1']] : [[]]
            variants.each { List<String> extra ->
                jobs.add(({ ->
                    GpuBuildTools.runChecked(base + extra + [cl], task.temporaryDir,
                            "clang OpenCL C 1.2 syntax check of ${lib.id} ${extra ? extra.join(' ') : '(plain)'}")
                    null
                }) as Callable<Object>)
            }
            checked.add("${lib.id} " + variants.collect { it ? it.join(' ') : 'plain' }.join(', '))
        }
        GpuBuildTools.parallel(jobs, GpuBuildTools.CORES, 'OpenCL syntax check')
        GpuBuildTools.writeText(stampFile, "clang OpenCL C 1.2 syntax check passed: ${checked.join('; ')}\n")
    }
}

tasks.register('updateKernelInventory') {
    group = 'build'
    description = 'Regenerates the checked-in kernels/<lib>/inventory.txt of every kernel library from its kernel sources (needs clang or nvcc)'
    doLast { task ->
        Map<GpuKernelLibrary, Map> generated = gpuLibraries.collectEntries { GpuKernelLibrary lib ->
            Map g = gpuGenerateInventory(task, lib)
            if (g == null) {
                throw new GradleException("updateKernelInventory needs a preprocessor: neither clang (-Pneuralfree.clang) nor nvcc (-Pnvcc) was found")
            }
            [(lib): g]
        }
        generated.each { GpuKernelLibrary lib, Map g ->
            boolean cudaOnlyEntries = lib.manifest(gpuSharedKernelRoot).any { it.cudaOnly }
            if (cudaOnlyEntries && !g.cudaPass) {
                throw new GradleException("updateKernelInventory: ${lib.inventoryPath} covers CUDA-only kernels "
                        + '(tagged [cuda] in the manifest), which the nvcc preprocessing pass generates; nvcc was not found')
            }
            String current = lib.inventoryFile.isFile() ? lib.inventoryFile.getText('UTF-8').replace('\r\n', '\n') : null
            if (current == g.text) {
                task.logger.lifecycle("updateKernelInventory: ${lib.inventoryPath} is up to date (${g.kernels} kernels, ${g.preprocessor})")
                return
            }
            GpuBuildTools.writeText(lib.inventoryFile, (String) g.text)
            task.logger.lifecycle("updateKernelInventory: wrote ${lib.inventoryPath} (${g.kernels} kernels, ${g.preprocessor})"
                    + (current == null ? '' : ': ' + GpuInventory.difference(current, (String) g.text)))
        }
    }
}

tasks.register('inventoryCheck') {
    group = 'verification'
    description = 'Checks argument limits and shader-variant coverage, and that every kernel library\'s inventory.txt matches its kernel sources'
    mustRunAfter 'updateKernelInventory'
    def stamp = gpuOut.map { it.file('check/inventory.stamp') }
    inputs.files(gpuKernelSources).withPropertyName('kernelSources').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(gpuSharedKernelSources).withPropertyName('sharedKernelSources').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(gpuInventoryFiles).withPropertyName('inventories').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(gpuVariantTables).withPropertyName('variantTables').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('libraries', gpuLibrariesFingerprint)
    inputs.property('preprocessor', providers.provider {
        File clang = gpuFindClang()
        GpuBuildTools.fingerprint(clang) + ' | ' + GpuBuildTools.fingerprint(gpuFindNvcc())
    })
    outputs.file(stamp)
    // The stamp is written only after a comparison with the sources, so an unchecked run repeats its warning.
    outputs.upToDateWhen { stamp.get().asFile.isFile() }
    doLast { task ->
        File stampFile = stamp.get().asFile
        stampFile.delete()
        List<String> checked = []
        boolean unchecked = false
        gpuLibraries.each { GpuKernelLibrary lib ->
            Map<String, Map> checkedIn = GpuInventory.read(lib, gpuInventoryCommand)
            Map generated = gpuGenerateInventory(task, lib)
            if (generated == null) {
                List<String> problems = GpuInventory.coverageProblems(lib, checkedIn, gpuSharedKernelRoot)
                if (!problems.isEmpty()) {
                    throw new GradleException("${lib.label} kernel inventory check failed (${lib.inventoryPath} as checked in):\n  " + problems.join('\n  '))
                }
                task.logger.warn("WARNING: neither clang nor nvcc found: ${lib.inventoryPath} is used as checked in; "
                        + 'its freshness against the kernel sources and the argument limits were not checked')
                unchecked = true
                return
            }
            String current = lib.inventoryFile.getText('UTF-8').replace('\r\n', '\n')
            if (current != generated.text) {
                if (!generated.cudaPass) {
                    // Without the nvcc pass the CUDA-only kernels of the checked-in file cannot be
                    // re-derived: the OpenCL-visible lines must match and the extras are allowed.
                    List<String> currentLines = current.split('\n').findAll { it.trim() as boolean }
                    List<String> generatedLines = generated.text.split('\n').findAll { it.trim() as boolean }
                    if (currentLines.containsAll(generatedLines)) {
                        task.logger.warn("WARNING: nvcc not found: ${lib.inventoryPath} keeps "
                                + (currentLines.size() - generatedLines.size())
                                + ' CUDA-only kernel lines that were not checked against the sources')
                        checked.add("${lib.inventoryPath} matches the kernel sources on the OpenCL-visible kernels"
                                + " (${generated.kernels} kernels, ${generated.preprocessor})")
                        return
                    }
                }
                throw new GradleException("${lib.inventoryPath} is stale: it does not match the kernel sources "
                        + "(${GpuInventory.difference(current, (String) generated.text)}).\nRegenerate it with: ${gpuInventoryCommand}")
            }
            checked.add("${lib.inventoryPath} matches the kernel sources (${generated.kernels} kernels, ${generated.preprocessor})")
            task.logger.lifecycle("inventoryCheck: ${lib.id} ${generated.kernels} kernels, ${generated.openClOnly} OpenCL-only kernels (${generated.preprocessor})")
        }
        if (!unchecked) {
            GpuBuildTools.writeText(stampFile, checked.collect { it + '\n' }.join(''))
        }
    }
}

/**
 * The [opencl] kernels of a library as a program built for pinned subgroups of sgSize lanes defines them, the twins
 * of its pinned variant rows (sg<N>): the clang preprocessor's output of the manifest with USE_SUBGROUPS=1,
 * NF_SG_ROW_SIZE=<sgSize> and the Intel subgroup extensions those sources require, scanned like the inventory.
 * Returns name -> [buffers, kinds, ...], or null when clang is absent.
 */
def gpuPinnedTwinKernels = { Task task, GpuKernelLibrary lib, int sgSize ->
    File clang = gpuFindClang()
    if (clang == null) {
        return null
    }
    List<Map> manifest = lib.manifest(gpuSharedKernelRoot)
    Set<String> openClOnly = manifest.findAll { it.openClOnly }.collect { (String) it.path } as Set
    File cl = new File(task.temporaryDir, "${lib.id}_sg${sgSize}_kernels.cl")
    File ii = new File(task.temporaryDir, "${lib.id}_sg${sgSize}_kernels.i")
    GpuBuildTools.writeText(cl, GpuKernelSources.concatenate(manifest.findAll { !it.cudaOnly }))
    GpuBuildTools.runChecked([clang, '-x', 'cl', '-cl-std=CL1.2', '-Xclang', '-finclude-default-header',
            '-DUSE_SUBGROUPS=1', "-DNF_SG_ROW_SIZE=${sgSize}", '-Dcl_intel_subgroups=1',
            '-Dcl_intel_required_subgroup_size=1', '-Dcl_intel_subgroup_local_block_io=1', '-E', cl, '-o', ii],
            task.temporaryDir, "preprocessing the ${lib.id} OpenCL kernel sources for ${sgSize}-lane subgroups")
    return GpuKernelSources.scanKernels(ii.getText('UTF-8')).findAll { it.file in openClOnly }
            .collectEntries { [((String) it.name): it] }
}

tasks.register('verifyGpuKernels') {
    group = 'verification'
    description = 'Builds every GPU kernel artifact and checks that CUDA, HIP, Vulkan and Metal cover every kernel library\'s inventory'
    dependsOn 'checkOpenCLKernels', 'inventoryCheck', 'compileCudaKernels', 'compileHipKernels', 'compileShaders', 'compileTestShaders', 'compileMetalShaders'
    doLast { task ->
        File generatedRoot = gpuOut.get().asFile
        List<String> problems = []
        List<String> summary = []
        gpuLibraries.each { GpuKernelLibrary lib ->
            Map<String, Map> inventory = GpuInventory.read(lib, gpuInventoryCommand)
            // Kernels of [cuda] manifest entries are required only of the CUDA fatbins; the HIP build never
            // serves them, and the Vulkan shader set may carry vulkan-flagged twins (the cooperative-matrix-2
            // attention), whose signatures are compared below like every other SPIR-V kernel of the inventory.
            Set<String> cudaOnlyPaths = lib.manifest(gpuSharedKernelRoot).findAll { it.cudaOnly }
                    .collect { (String) it.path } as Set
            Set<String> portableInventory = inventory.findAll { !(it.value.file in cudaOnlyPaths) }.keySet()
            List<String> covered = []
            // Rows flagged vulkan name kernels of the Vulkan shader set alone: the SPIR-V index carries them,
            // while CUDA, HIP and Metal never build them and the Metal generator skips their modules.
            Set<String> vulkanOnly = GpuShaderVariants.read(lib.variantsDir, lib.shaderRoot, lib.subgroupVariants)
                    .findAll { it.vulkan }.collect { (String) it.name } as Set
            Closure coverage = { String what, Set<String> built, Set<String> allowedExtras = [] as Set ->
                Set<String> required = what == 'CUDA' ? inventory.keySet() : portableInventory
                List<String> missing = (required - built).sort()
                List<String> extra = (built - inventory.keySet() - allowedExtras).sort()
                if (!missing.isEmpty()) {
                    problems.add("${lib.id}: ${what} index lacks ${missing.size()} kernels: ${missing.join(', ')}")
                }
                if (!extra.isEmpty()) {
                    problems.add("${lib.id}: ${what} index has ${extra.size()} kernels outside the inventory: ${extra.join(', ')}")
                }
                covered.add(what + ' ok')
            }
            File cudaIndex = new File(generatedRoot, 'cuda/' + lib.cudaDir + '/index.tsv')
            if (cudaIndex.isFile()) {
                coverage('CUDA', cudaIndex.readLines('UTF-8').findAll { !it.isEmpty() }.collect { it.split('\t')[0] } as Set<String>)
            } else {
                task.logger.warn("WARNING: ${lib.id} CUDA kernels were not built: CUDA coverage not checked")
            }
            File hipIndex = new File(generatedRoot, 'hip/' + lib.hipDir + '/index.tsv')
            if (hipIndex.isFile()) {
                coverage('HIP', hipIndex.readLines('UTF-8').findAll { !it.isEmpty() }.collect { it.split('\t')[0] } as Set<String>)
            } else {
                task.logger.warn("WARNING: ${lib.id} HIP kernels were not built: HIP coverage not checked")
            }
            File spvIndex = new File(generatedRoot, 'spv/' + lib.shaderRootPath + '/index.properties')
            Properties spvProperties = null
            if (spvIndex.isFile()) {
                Properties p = new Properties()
                spvIndex.withInputStream { p.load(it) }
                spvProperties = p
                Set<String> spv = p.stringPropertyNames().findAll { it.endsWith('.buffers') }
                        .collect { it.substring(0, it.length() - '.buffers'.length()) } as Set
                // Pinned modules (.sgsize) are the Vulkan twins of [opencl] kernels, outside the portable inventory.
                Set<String> pinned = spv.findAll { p.getProperty(it + '.sgsize') != null } as Set
                List<String> pinnedPortable = pinned.intersect(inventory.keySet()).sort()
                if (!pinnedPortable.isEmpty()) {
                    problems.add("${lib.id}: SPIR-V pins the subgroup width of portable kernels: ${pinnedPortable.join(', ')}")
                }
                coverage('SPIR-V', spv - pinned, vulkanOnly)
                // 'i' and 'u' are both 32-bit integers on the Java side; without compareKinds only the count matters.
                Closure<String> kindClass = { String kind -> lib.compareKinds ? (kind == 'f' ? 'f' : 'i') : 's' }
                (inventory.keySet().intersect(spv)).sort().each { String name ->
                    Map k = inventory[name]
                    int buffers = Integer.parseInt(p.getProperty(name + '.buffers'))
                    String push = p.getProperty(name + '.push', '')
                    List<String> kinds = push.isEmpty() ? [] : push.split(',').toList()
                    if (buffers != k.buffers || ((List<String>) k.kinds).collect(kindClass) != kinds.collect(kindClass)) {
                        problems.add("${lib.id}: ${name}: GLSL has ${buffers} buffers and scalars (${push}), the .cl kernel ${k.buffers} buffers and scalars (${((List) k.kinds).join(',')})")
                    }
                }
                // A pinned module takes the argument list of its [opencl] twin, defined only in a subgroup program.
                Map<Integer, List<String>> pinnedByWidth = pinned.groupBy { Integer.parseInt(p.getProperty(it + '.sgsize').trim()) }
                pinnedByWidth.keySet().sort().each { Integer width ->
                    Map<String, Map> twins = gpuPinnedTwinKernels(task, lib, width)
                    if (twins == null) {
                        task.logger.warn("WARNING: clang not found: ${lib.id} pinned ${width}-lane modules were not compared with their OpenCL twins")
                        return
                    }
                    pinnedByWidth[width].sort().each { String name ->
                        Map k = twins[name]
                        int buffers = Integer.parseInt(p.getProperty(name + '.buffers'))
                        String push = p.getProperty(name + '.push', '')
                        List<String> kinds = push.isEmpty() ? [] : push.split(',').toList()
                        if (k == null) {
                            problems.add("${lib.id}: ${name}: pinned to ${width} lanes, but no [opencl] source defines it for ${width}-lane subgroups")
                        } else if (buffers != k.buffers || ((List<String>) k.kinds).collect(kindClass) != kinds.collect(kindClass)) {
                            problems.add("${lib.id}: ${name}: the pinned GLSL module has ${buffers} buffers and scalars (${push}), its .cl twin ${k.buffers} buffers and scalars (${((List) k.kinds).join(',')})")
                        }
                    }
                    covered.add("${pinnedByWidth[width].size()} sg${width} twins ok")
                }
            } else {
                task.logger.warn("WARNING: ${lib.id} SPIR-V was not built: Vulkan coverage not checked")
            }
            File metalIndex = new File(generatedRoot, 'metal/' + lib.shaderRootPath + '/metal/index.properties')
            if (metalIndex.isFile()) {
                Properties m = new Properties()
                metalIndex.withInputStream { m.load(it) }
                Set<String> metal = m.stringPropertyNames().findAll { it.endsWith('.buffers') }
                        .collect { it.substring(0, it.length() - '.buffers'.length()) } as Set
                coverage('Metal', metal)
                metal.sort().each { String name ->
                    File source = new File(metalIndex.parentFile, name + '.metal')
                    if (!source.isFile()) {
                        problems.add("${lib.id}: ${name}: the Metal index lists the kernel but ${source.name} is missing")
                    } else if (!source.getText('UTF-8').contains('kernel void ' + name + '(')) {
                        problems.add("${lib.id}: ${name}: ${source.name} does not define 'kernel void ${name}'")
                    }
                    if (spvProperties != null) {
                        ['.buffers', '.ro', '.push'].each { String key ->
                            if (m.getProperty(name + key) != spvProperties.getProperty(name + key)) {
                                problems.add("${lib.id}: ${name}: Metal ${key} is ${m.getProperty(name + key)}, SPIR-V has ${spvProperties.getProperty(name + key)}")
                            }
                        }
                    }
                }
            } else {
                task.logger.warn("WARNING: ${lib.id} Metal sources were not generated: Metal coverage not checked")
            }
            summary.add("${lib.id} ${inventory.size()} kernels covered" + (covered ? ' (' + covered.join(', ') + ')' : ''))
        }
        if (!problems.isEmpty()) {
            throw new GradleException("GPU kernel verification failed:\n  " + problems.join('\n  '))
        }
        task.logger.lifecycle("verifyGpuKernels: ${summary.join('; ')}")
    }
}
