# NeuralFree server defaults (PARITY plan SV-0; llama.cpp-compatible HTTP surface on loopback).
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.limits.max-body-size=16M
quarkus.http.cors.enabled=false
# Tracing is opt-in at the SDK level (PARITY §3.7: core carries timing fields, OB-2).
quarkus.otel.sdk.disabled=true
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.banner.enabled=false
# With the Netty native artifacts excluded in server/build.gradle, no native library is loaded
# (PARITY §5.5.1 N-3: native bytes cannot be bound to the runtime identity).
quarkus.vertx.prefer-native-transport=false
# gRPC serves on the HTTP port (SV-9).
quarkus.grpc.server.use-separate-server=false
# The packaged server runs every class from one jar on the JVM's application class loader, which
# RuntimeIdentity can bind (PARITY §5.5.1 N-3); the fast-jar RunnerClassLoader and dev-mode loaders
# cannot be bound, so under them persistence is refused with the loader's name.
quarkus.package.jar.type=uber-jar
