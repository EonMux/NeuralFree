# NeuralFree server defaults (llama.cpp-compatible HTTP surface on loopback).
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
# Admit a 25 MiB audio upload (the speech-to-text cap) plus its multipart framing and a base64 data URL.
quarkus.http.limits.max-body-size=40M
# A realtime client may append audio in chunks larger than the 64 KiB default; the clip itself is still capped.
quarkus.websockets-next.server.max-message-size=1048576
# llama-server's CORS defaults. Preflight is answered before API-key authentication.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true
# Tracing is opt-in: the OpenTelemetry SDK stays disabled unless the embedder turns it on.
quarkus.otel.sdk.disabled=true
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.banner.enabled=false
# With the Netty native artifacts excluded in server/build.gradle, no native library is loaded
# (native bytes cannot be bound to the runtime identity, see the packaged-jar note below).
quarkus.vertx.prefer-native-transport=false
# gRPC rides the HTTP port when the server launches with --grpc (neuralfree.server.grpc); without it the
# ingress answers every gRPC call UNIMPLEMENTED, reflection and health included. With the switch on, the
# standard health service serves probes and server reflection serves grpcurl-style clients.
quarkus.grpc.server.use-separate-server=false
quarkus.grpc.server.grpc-health.enabled=true
quarkus.grpc.server.enable-reflection-service=true
# The packaged server runs every class from one jar on the JVM's application class loader, which
# RuntimeIdentity can bind; the fast-jar RunnerClassLoader and dev-mode loaders
# cannot be bound, so under them persistence is refused with the loader's name.
quarkus.package.jar.type=uber-jar
# The runner jar's name: server/build/neuralfree-server-<version>-runner.jar, the file the
# distribution's server/ directory carries and the serve command launches.
quarkus.package.output-name=neuralfree-server
