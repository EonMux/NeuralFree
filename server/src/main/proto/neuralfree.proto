// The gRPC surface of the NeuralFree server: text generation and the serving control plane.
//
// The schema follows vLLM's gRPC protocol (vllm/rust/proto/inference.proto and control.proto) where the
// engine offers the behaviour, and leaves out what it does not: multimodal media, KV connector transfer
// parameters, watermarking, KV hints, weight transfer and the draft-model lifecycle are not part of this
// protocol. A field the engine cannot honour is refused by name, never silently ignored.
syntax = "proto3";

package neuralfree;

option java_multiple_files = true;
option java_package = "com.eonmux.neuralfree.grpc";
option java_outer_classname = "NeuralFreeProto";

// ======================================================================================
// Inference
// ======================================================================================

service Inference {
  // Generates text for one prompt; every requested sequence answers in one response.
  rpc Generate (GenerateRequest) returns (GenerateResponse) {}
  // Generates text for one prompt, streaming the outputs as they are produced. The first message carries
  // the prompt info, the following ones the generated pieces, and the last one each sequence's finish info.
  rpc GenerateStream (GenerateRequest) returns (stream GenerateResponse) {}
}

message TokenIds {
  repeated uint32 ids = 1;
}

message StringChoices {
  repeated string choices = 1;
}

message GenerateRequest {
  // Client-chosen id of the request; an abort or a duplicate detection uses it. Optional.
  string request_id = 1;
  // The served model name; empty takes the first served name. In router mode a name is required.
  string model = 2;

  oneof prompt {
    // Prompt text, tokenized with the model's vocabulary.
    string text = 3;
    // Prompt token ids, used as they are.
    TokenIds token_ids = 4;
  }

  // Sampling temperature; omitted keeps the server default.
  optional float temperature = 5;
  RandomSampling sampling = 6;
  DecodingParameters decoding = 7;
  StoppingCriteria stopping = 8;
  ResponseOptions response = 9;
  KVCacheParameters kv = 10;

  // Keep only the first N prompt tokens (vLLM's right truncation side); 0 keeps the prompt whole.
  uint32 truncate_prompt_tokens = 11;

  // Scheduling priority (the engine's priority policy); 0 is the default.
  int32 priority = 12;

  // The LoRA adapter the request runs, or empty for the base model.
  string lora_name = 15;
}

message RandomSampling {
  // Sequences generated per prompt ("n"); 0 means 1.
  uint32 num_sequences = 1;
  // Top-k cutoff; 0 disables it, omitted keeps the server default.
  optional uint32 top_k = 2;
  // Nucleus cutoff in (0, 1]; omitted keeps the server default.
  optional float top_p = 3;
  // Min-p cutoff; 0 disables it, omitted keeps the server default.
  optional float min_p = 4;
  // Sampling seed; omitted draws a fresh one per sequence.
  optional int64 seed = 5;
  // Typical-p cutoff in [0, 1]; omitted keeps the server default.
  optional float typical_p = 6;
  // Tokens the sampler keeps regardless of the cutoffs.
  optional int32 min_keep = 7;
}

message DecodingParameters {
  // Omitted penalties keep the server default; 0 is no penalty.
  optional float presence_penalty = 1;
  optional float frequency_penalty = 2;
  optional float repetition_penalty = 3;
  // Penalty window; -1 is the whole context, 0 disables the penalties, omitted keeps the server default.
  optional int32 penalty_last_n = 12;
  // Token id to logit bias.
  map<uint32, float> logit_bias = 4;
  // When non-empty, only these token ids may be sampled.
  repeated uint32 allowed_token_ids = 5;

  // The output constraint; at most one kind may be given.
  oneof structured_output {
    // A JSON schema the output must follow.
    string json = 6;
    // A regular expression the whole output must match.
    string regex = 7;
    // Exactly one of the given strings.
    StringChoices choice = 8;
    // A GBNF or Lark grammar.
    string grammar = 9;
    // Any JSON object.
    bool json_object = 10;
    // A structural tag.
    string structural_tag = 11;
  }

  // Phrases the output must not spell.
  repeated string bad_words = 13;
}

message StoppingCriteria {
  // New-token budget; 0 keeps the server default.
  uint32 max_new_tokens = 1;
  // Minimum new tokens before an end-of-generation token may end the output.
  uint32 min_new_tokens = 2;
  repeated uint32 stop_token_ids = 3;
  repeated string stop_strings = 4;
  // Whether a matched stop string stays in the output text.
  bool include_stop_strings = 5;
  bool ignore_eos = 6;
  // Reasoning-token cap; omitted disables it, 0 ends reasoning at once.
  optional int64 thinking_token_budget = 7;
}

message ResponseOptions {
  // Include the prompt token ids in the prompt info.
  bool prompt_token_ids = 1;
  // Include the per-prompt-token log probabilities.
  bool prompt_logprobs = 2;
  optional CandidateTokens prompt_candidates = 3;

  // Return the generated text; omitted means true. False requires empty stop_strings.
  optional bool output_text = 4;
  // Include the generated token ids.
  bool output_token_ids = 5;
  // Include the sampled token's log probability per generated token.
  bool output_logprobs = 6;
  optional CandidateTokens output_candidates = 7;
  // Render special tokens as their piece text; omitted means true (skip them).
  optional bool skip_special_tokens = 8;
}

// Which extra candidate tokens each position reports.
message CandidateTokens {
  oneof select {
    // The sampled token plus its best N alternatives.
    uint32 top_n = 1;
    // The sampled token plus exactly these token ids.
    TokenIds token_ids = 2;
    // Every vocabulary token; supported for prompt candidates only.
    bool all = 3;
  }
}

message KVCacheParameters {
  // Serve the request without reusing a cached prefix.
  bool bypass_prefix_cache = 1;
  // Prefix-cache salt; cached entries match it exactly.
  string cache_salt = 2;
}

// ======================================================================================
// Generate response
// ======================================================================================

message GenerateResponse {
  // Present in the first response of a request.
  PromptInfo prompt_info = 1;
  // One entry per generated sequence; a stream carries one per message.
  repeated SequenceOutput outputs = 2;
}

message PromptInfo {
  uint32 num_prompt_tokens = 1;
  // The prompt token ids, when requested.
  repeated uint32 token_ids = 2;
  // The prompt-token log probabilities, when requested; rows with no capture are absent.
  repeated PromptTokenLogprob logprobs = 3;
  // The prompt tokens the prefix cache served, when the engine reused a prefix.
  uint32 num_cached_tokens = 4;
}

message PromptTokenLogprob {
  // The index into PromptInfo.token_ids the entry describes.
  uint32 token_index = 1;
  TokenLogprob token = 2;
}

message SequenceOutput {
  // The sequence's index ("n" sequences are numbered from 0).
  uint32 index = 1;
  // The text this output adds; empty when output_text is off.
  string text = 2;
  // The number of generated tokens this output represents: the chunk's tokens, or the sequence's total
  // in its final output.
  uint32 num_tokens = 3;
  // The generated token ids, when requested.
  repeated uint32 token_ids = 4;
  // One entry per generated token, when log probabilities or candidates were requested.
  repeated TokenLogprob logprobs = 5;
  // Present only in the sequence's final output.
  FinishInfo finish_info = 6;
}

message TokenLogprob {
  uint32 token_id = 1;
  float logprob = 2;
  uint32 rank = 3;
  // The alternatives after the sampled token, when candidates were requested.
  repeated TokenInfo candidates = 4;
}

message TokenInfo {
  uint32 id = 1;
  float logprob = 2;
  uint32 rank = 3;
}

message FinishInfo {
  uint32 num_output_tokens = 1;

  enum FinishReason {
    NOT_FINISHED = 0;
    LENGTH = 1;
    STOP = 2;
    ABORTED = 3;
  }

  FinishReason finish_reason = 2;

  oneof stop_reason {
    // The request's stop token id that ended the output.
    uint32 stop_token_id = 3;
    // The vocabulary's end-of-generation token that ended the output.
    uint32 eos_token_id = 4;
    // The stop string that ended the output.
    string stop_string = 5;
  }

  // The prompt tokens the prefix cache served.
  optional uint32 num_cached_tokens = 9;
}

// ======================================================================================
// Control
// ======================================================================================

service Control {
  // Server and model discovery.
  rpc GetServerInfo (GetServerInfoRequest) returns (ServerInfo) {}
  rpc GetModelInfo (GetModelInfoRequest) returns (ModelInfo) {}

  // Cancels the named in-flight requests; unknown ids are ignored.
  rpc Abort (AbortRequest) returns (AbortResponse) {}

  // LoRA lifecycle.
  rpc LoadLora (LoadLoraRequest) returns (LoadLoraResponse) {}
  rpc UnloadLora (UnloadLoraRequest) returns (UnloadLoraResponse) {}
  rpc ListLoras (ListLorasRequest) returns (ListLorasResponse) {}

  // KV event transport discovery.
  rpc GetKvEventSources (GetKvEventSourcesRequest) returns (GetKvEventSourcesResponse) {}

  // Reinforcement-learning lifecycle.
  rpc PauseGeneration (PauseGenerationRequest) returns (PauseGenerationResponse) {}
  rpc ResumeGeneration (ResumeGenerationRequest) returns (ResumeGenerationResponse) {}
  rpc IsPaused (IsPausedRequest) returns (IsPausedResponse) {}
  rpc Sleep (SleepRequest) returns (SleepResponse) {}
  rpc WakeUp (WakeUpRequest) returns (WakeUpResponse) {}
  rpc IsSleeping (IsSleepingRequest) returns (IsSleepingResponse) {}
}

enum PauseMode {
  PAUSE_MODE_UNSPECIFIED = 0;  // the abort mode, as the HTTP routes default to
  PAUSE_MODE_ABORT = 1;        // cancel queued and running requests
  PAUSE_MODE_WAIT = 2;         // let queued and running requests finish
  PAUSE_MODE_KEEP = 3;         // freeze scheduling, keep requests queued
}

message GetServerInfoRequest {
  string model = 1;
}

message ServerInfo {
  string engine_version = 1;
  // The gRPC protocol version this server speaks.
  string api_version = 2;
  // This server process's identity.
  string instance_id = 3;
  ParallelismInfo parallelism = 4;
  // The context a request may fill, 0 while no model is open.
  uint32 max_model_len = 5;
  // The pool's sequence slots, the requests it runs side by side, 0 before the engine builds.
  uint64 max_running_requests = 6;
  string proto_version = 7;
}

message ParallelismInfo {
  uint32 tensor_parallel_size = 1;
  uint32 pipeline_parallel_size = 2;
  uint32 data_parallel_size = 3;
  uint32 data_parallel_rank = 4;
  uint64 world_size = 6;
}

message GetModelInfoRequest {
  string model = 1;
}

message ModelInfo {
  string model_id = 1;
  string served_model_name = 2;
  repeated string served_model_aliases = 3;
  bool supports_text_input = 20;
  bool supports_token_ids_input = 21;
  bool supports_lora = 22;
  bool supports_multimodal = 23;
  string reasoning_parser = 24;
  string tool_call_parser = 25;
}

message AbortRequest {
  repeated string request_ids = 1;
}

message AbortResponse {}

// ======================================================================================
// LoRA lifecycle
// ======================================================================================

message LoraAdapter {
  // The adapter's position in the load order, llama.cpp's id.
  int64 lora_id = 1;
  string lora_name = 2;
  string source_path = 3;
  // The global scale a request that selects no adapter runs it at.
  float scale = 4;
}

message LoadLoraRequest {
  string lora_name = 1;
  string source_path = 2;
  // Replace an adapter of the same name.
  bool load_inplace = 3;
  string model = 4;
}

message LoadLoraResponse {
  LoraAdapter adapter = 1;
}

message UnloadLoraRequest {
  string lora_name = 1;
  string model = 2;
}

message UnloadLoraResponse {
  LoraAdapter adapter = 1;
}

message ListLorasRequest {
  string model = 1;
}

message ListLorasResponse {
  repeated LoraAdapter adapters = 1;
}

// ======================================================================================
// KV event discovery
// ======================================================================================

message GetKvEventSourcesRequest {
  string model = 1;
}

message GetKvEventSourcesResponse {
  repeated KvEventSource sources = 1;
}

message KvEventSource {
  string transport = 1;
  string endpoint = 2;
  string topic = 3;
  string replay_endpoint = 4;
  optional uint32 data_parallel_rank = 5;
  string encoding = 6;
  uint32 schema_version = 7;
  uint32 buffer_steps = 8;
  uint32 hwm = 9;
  uint32 max_queue_size = 10;
}

// ======================================================================================
// Reinforcement-learning lifecycle
// ======================================================================================

message PauseGenerationRequest {
  PauseMode mode = 1;
  optional bool clear_cache = 2;
  string model = 3;
}

message PauseGenerationResponse {}

message ResumeGenerationRequest {
  string model = 1;
}

message ResumeGenerationResponse {}

message IsPausedRequest {
  string model = 1;
}

message IsPausedResponse {
  bool paused = 1;
}

message SleepRequest {
  // 0 pauses the scheduling, 1 also drops the KV cache contents, 2 the weights too; omitted means 1.
  optional uint32 level = 1;
  PauseMode mode = 2;
  string model = 3;
}

message SleepResponse {
  uint32 level = 1;
}

message WakeUpRequest {
  repeated string tags = 1;
  string model = 2;
}

message WakeUpResponse {
  // "awake" when every replica serves again, "sleeping" when a scheduling-only wake left one asleep.
  string status = 1;
}

message IsSleepingRequest {
  string model = 1;
}

message IsSleepingResponse {
  bool sleeping = 1;
}
