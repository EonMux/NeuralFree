plugins { id 'java'; id 'io.quarkus' }
// the runner jar's name in server/build and in the distribution's server/ directory, with the
// root project's version (Quarkus names it <archivesName>-<version>-runner.jar)
version = rootProject.version
base { archivesName = 'neuralfree-server' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenLocal(); mavenCentral() }
dependencies {
    implementation enforcedPlatform('io.quarkus.platform:quarkus-bom:3.40.1')
    implementation project(':')
    testImplementation project(path: ':', configuration: 'testOutput')
    // the KV cache events subscriber of the tests speaks the core's ZMQ transport and msgpack
    testImplementation "org.zeromq:jeromq:${rootProject.jeromqVersion}"
    testImplementation "org.msgpack:msgpack-core:${rootProject.msgpackVersion}"
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-websockets-next'
    implementation 'io.quarkus:quarkus-grpc'
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-opentelemetry'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'org.jboss.logmanager:log4j2-jboss-logmanager'
    testImplementation 'io.quarkus:quarkus-junit'
    // the gRPC tests' client transport; the server side is Quarkus's
    testImplementation 'io.grpc:grpc-netty'
}
configurations.all {
    exclude group: 'io.netty', module: 'netty-transport-native-epoll'
    exclude group: 'io.netty', module: 'netty-transport-native-kqueue'
    exclude group: 'io.netty', module: 'netty-transport-native-io_uring'
    exclude group: 'io.netty', module: 'netty-tcnative-boringssl-static'
    exclude group: 'io.netty.incubator'
    // The gRPC client transport of the tests wants animal-sniffer-annotations 1.27; the 1.24 the rest of the
    // build resolves is sufficient (they are class-retention annotations only, not code).
    resolutionStrategy { force 'org.codehaus.mojo:animal-sniffer-annotations:1.24' }
}

// The version /version reports: the root project's version, expanded into the server's version resource.
def serverVersion = rootProject.version.toString()
processResources {
    inputs.property('serverVersion', serverVersion)
    filesMatching('neuralfree-server-version.properties') { expand(version: serverVersion) }
}

// Full exception format for the message-last test style: the assertions name the mismatch.
tasks.withType(Test).configureEach {
    testLogging { exceptionFormat = 'full' }
    // the incubator Vector API module, so the CPU kernels the server inherits from the core jar are usable
    // in the test JVM (CpuSimd falls back to the scalar kernels without it)
    jvmArgs '--add-modules=jdk.incubator.vector'
    // neuralfree.* system (-D) and project (-P) properties reach the test JVM, so a run selects the engine
    // backend the tests open their models on (-Pneuralfree.backend=cuda)
    systemProperties System.properties.findAll { it.key.startsWith('neuralfree.') }
    project.properties.findAll { it.key.startsWith('neuralfree.') }.each { k, v -> systemProperty k, v }
}

// Writes the server's resolved compile classpaths (MAINCP and TESTCP) to build/classpath.txt,
// for tooling that compiles the server sources directly against the resolved jars.
task writeServerClasspath {
    description = 'Writes the main and test compile classpaths to build/classpath.txt for srvjavac.sh'
    group = 'build'

    doLast {
        def file = layout.buildDirectory.file('classpath.txt').get().asFile
        file.parentFile.mkdirs()
        file.text = 'MAINCP=' + sourceSets.main.compileClasspath.files*.absolutePath.join(':') + '\n' +
                    'TESTCP=' + sourceSets.test.compileClasspath.files*.absolutePath.join(':') + '\n'
    }
}

// Server hot-path microbenchmarks (JMH 1.37, server/src/jmh/java), in the server's packages so they reach its
// package-private writers: `./gradlew serverJmh -Pjmh.args='<JMH options>'`. The task has its own name because
// Gradle runs a task name in every project that has it, so a root `jmh` filter would also reach this JMH run, which
// exits with an error when the filter matches none of its benchmarks. Neither the benchmarks nor JMH are packaged
// into the runner.
sourceSets {
    jmh {
        java.srcDirs = ['src/jmh/java']
        resources.srcDirs = []
    }
}
sourceSets.jmh.compileClasspath += sourceSets.main.output.classesDirs + configurations.compileClasspath
sourceSets.jmh.runtimeClasspath += sourceSets.main.runtimeClasspath
dependencies {
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}
tasks.register('serverJmh', JavaExec) {
    group = 'verification'
    description = 'Runs the JMH microbenchmarks of server/src/jmh/java; -Pjmh.args passes JMH options and filters.'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    jvmArgs '--add-modules=jdk.incubator.vector'
    def jmhArgs = project.findProperty('jmh.args')
    if (jmhArgs != null) {
        args jmhArgs.toString().trim().split(/\s+/).findAll { !it.isEmpty() }
    }
}
