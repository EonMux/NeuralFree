plugins {
    id 'java-library'
    id 'maven-publish'
    id 'application'
}

repositories {
    mavenCentral()
}

def static getOsString() {
    String vendor = System.getProperty("java.vendor");
    if ("The Android Project" == vendor) {
        return "android";
    } else {
        String osName = System.getProperty("os.name");
        osName = osName.toLowerCase(Locale.ENGLISH);
        if (osName.startsWith("windows")) {
            return "windows";
        } else if (osName.startsWith("mac os")) {
            return "apple";
        } else if (osName.startsWith("linux")) {
            return "linux";
        } else if (osName.startsWith("sun")) {
            return "sun"
        }
        return "unknown"
    }
}

def static getArchString() {
    String osArch = System.getProperty("os.arch");
    osArch = osArch.toLowerCase(Locale.ENGLISH);
    if ("i386" == osArch || "x86" == osArch || "i686" == osArch) {
        return "x86";
    } else if (osArch.startsWith("amd64") || osArch.startsWith("x86_64")) {
        return "x86_64";
    } else if (osArch.startsWith("arm64")) {
        return "arm64";
    } else if (osArch.startsWith("arm")) {
        return "arm";
    } else if ("ppc" == osArch || "powerpc" == osArch) {
        return "ppc";
    } else if (osArch.startsWith("ppc")) {
        return "ppc_64";
    } else if (osArch.startsWith("sparc")) {
        return "sparc";
    } else if (osArch.startsWith("mips64")) {
        return "mips64";
    } else if (osArch.startsWith("mips")) {
        return "mips";
    } else if (osArch.contains("risc")) {
        return "risc";
    }
    return "unknown";
}

/**
 * The LWJGL natives classifier of this machine (natives-linux, natives-windows-arm64, ...), or null when LWJGL
 * publishes none for it.
 */
def static lwjglNativesClassifier(String os, String arch) {
    Map<String, String> classifiers = [
            'linux-x86_64'  : 'natives-linux',
            'linux-arm64'   : 'natives-linux-arm64',
            'linux-arm'     : 'natives-linux-arm32',
            'linux-ppc_64'  : 'natives-linux-ppc64le',
            'linux-risc'    : 'natives-linux-riscv64',
            'windows-x86_64': 'natives-windows',
            'windows-x86'   : 'natives-windows-x86',
            'windows-arm64' : 'natives-windows-arm64',
            'apple-x86_64'  : 'natives-macos',
            'apple-arm64'   : 'natives-macos-arm64',
    ]
    return classifiers[os + '-' + arch]
}

dependencies {
    // Abacus Util (float streams): https://github.com/landawn/AbacusUtil
    implementation 'com.landawn:abacus-util:2.1.5'

    // JeroMQ (pure-Java ZMQ, the transport of the KV cache events, vLLM's ZmqEventPublisher):
    // https://github.com/zeromq/jeromq
    project.ext.jeromqVersion = '0.6.0'
    implementation "org.zeromq:jeromq:$jeromqVersion"

    // msgpack-java core (the msgpack encoding of the KV cache event batches, vLLM's msgspec layout):
    // https://github.com/msgpack/msgpack-java
    project.ext.msgpackVersion = '0.9.9'
    implementation "org.msgpack:msgpack-core:$msgpackVersion"

    // JUnit 4
    testImplementation 'junit:junit:4.13.2'

    // Log4j 2: the code logs through the API; the core implementation is a runtime dependency, and the tests
    // also use it to capture log events
    project.ext.log4jVersion = '2.26.1'
    api "org.apache.logging.log4j:log4j-api:$log4jVersion"
    runtimeOnly "org.apache.logging.log4j:log4j-core:$log4jVersion"
    testImplementation "org.apache.logging.log4j:log4j-core:$log4jVersion"

    // Brownies collections (GapList, FloatGapList): http://www.magicwerk.org/page-collections-download.html
    implementation 'org.magicwerk:brownies-collections:0.9.14'

    // JCuda; its natives are published for linux-x86_64 and windows-x86_64 only
    project.ext.classifier = getOsString() + "-" + getArchString()
    project.ext.jCudaVersion = "12.6.0"

    implementation(group: 'org.jcuda', name: 'jcuda', version: jCudaVersion) {
        transitive = false
    }
    if (classifier in ['linux-x86_64', 'windows-x86_64']) {
        runtimeOnly group: 'org.jcuda', name: 'jcuda-natives', classifier: classifier, version: jCudaVersion
    }

    // JOCL (OpenCL)
    implementation 'org.jocl:jocl:2.0.6'

    // JNA: calls the OpenCL extension functions JOCL does not bind (cl_khr_command_buffer)
    implementation 'net.java.dev.jna:jna:5.6.0'

    // LWJGL Vulkan
    project.ext.lwjglVersion = "3.4.1"

    implementation "org.lwjgl:lwjgl:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-vulkan:$lwjglVersion"

    def lwjglNatives = lwjglNativesClassifier(getOsString(), getArchString())
    if (lwjglNatives != null) {
        runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:$lwjglNatives"
    }
}

group = 'com.eonmux'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// The installable CLI distribution: ./gradlew installDist produces build/install/neuralfree with the
// bin/neuralfree start scripts and the launcher's jars under lib/, plus the HTTP server's packaged
// uber-jar under server/ (not lib/, so the runner's copy of the classes stays off the launcher
// classpath) for 'neuralfree serve' to launch (see ServeCommand). Every command is a subcommand of
// the one entry point, as llama.cpp's app binary routes its tools. The server jar is wired after
// evaluation: the root project configures before :server registers its Quarkus tasks.
application {
    applicationName = 'neuralfree'
    mainClass = 'com.eonmux.neuralfree.cli.Launcher'
    applicationDefaultJvmArgs = ['-Xmx4g', '--add-opens=java.base/java.util=ALL-UNNAMED']
}

// The start scripts resolve jdk.incubator.vector themselves for the commands that run the engine in the launcher's
// JVM, on a Java 17 or later runtime whose image holds the module (gradle/start-scripts), so the launcher's
// JvmVectorModule relaunch is left for java -jar and runtimes without a readable release file. The Unix snippet goes
// after the line that sets DEFAULT_JVM_OPTS, the Windows one before the java command, once JAVA_HOME is unquoted; a
// script without its anchor line fails the build.
def vectorModuleSnippets = [file('gradle/start-scripts/vector-module.sh'), file('gradle/start-scripts/vector-module.bat')]
def injectVectorModule = { CreateStartScripts task ->
    task.inputs.files(vectorModuleSnippets).withPropertyName('vectorModuleSnippets')
    task.doLast {
        def insert = { File script, File snippet, String anchor, boolean after, String eol ->
            def text = script.text
            def at = text.indexOf(eol + anchor)
            if (at < 0) {
                throw new GradleException("${script.name}: no line starting '${anchor}' to place the vector module by")
            }
            def lineStart = at + eol.length()
            def split = after ? text.indexOf(eol, lineStart) + eol.length() : lineStart
            def body = snippet.text.normalize().readLines().join(eol) + eol
            script.text = text.substring(0, split) + (after ? eol + body : body + eol) + text.substring(split)
        }
        insert(task.unixScript, vectorModuleSnippets[0], 'DEFAULT_JVM_OPTS=', true, '\n')
        insert(task.windowsScript, vectorModuleSnippets[1], '@rem Execute ', false, '\r\n')
    }
}
tasks.named('startScripts', CreateStartScripts) { injectVectorModule(it) }

// The same start scripts over an empty class path, for StartScriptVectorModuleTest to run: they need neither the jar
// nor the GPU kernels its resources hold.
def testStartScripts = tasks.register('testStartScripts', CreateStartScripts) {
    outputDir = layout.buildDirectory.dir('test-start-scripts').get().asFile
    applicationName = application.applicationName
    mainClass = application.mainClass
    defaultJvmOpts = application.applicationDefaultJvmArgs
    classpath = files()
    injectVectorModule(it)
}

gradle.projectsEvaluated {
    def quarkusBuild = project(':server').tasks.findByName('quarkusBuild')
    if (quarkusBuild != null) {
        distributions {
            main {
                contents {
                    duplicatesStrategy = 'EXCLUDE'
                    into('server') {
                        // only the runner jar: the Quarkus task also emits build metadata the
                        // distribution must not carry, and its outputs list the jar twice
                        from quarkusBuild
                        include '*-runner.jar'
                    }
                }
            }
        }
        tasks.named('installDist').configure { dependsOn quarkusBuild }
        tasks.named('distZip').configure { dependsOn quarkusBuild }
        tasks.named('distTar').configure { dependsOn quarkusBuild }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
            pom {
                name = 'NeuralFree'
                description = 'Hardware-accelerated deep learning framework for Java: training and GGUF language model inference on OpenCL, CUDA and Vulkan GPUs or the CPU'
                url = 'https://github.com/EonMux/NeuralFree'
                licenses {
                    license {
                        name = 'NeuralFree License (Apache License 2.0 with an Additional Commercial Use Condition)'
                        url = 'https://github.com/EonMux/NeuralFree/blob/main/LICENSE'
                        distribution = 'repo'
                    }
                }
                organization {
                    name = 'EONMUX LTD'
                    url = 'https://github.com/EonMux'
                }
                scm {
                    url = 'https://github.com/EonMux/NeuralFree'
                    connection = 'scm:git:https://github.com/EonMux/NeuralFree.git'
                    developerConnection = 'scm:git:git@github.com:EonMux/NeuralFree.git'
                }
            }
        }
    }
}

// Test sources compile against the main classes only, so compiling them does not build the GPU kernels
// that processResources merges; the test runtime classpath still holds every main resource. GpuHipToolkit
// (buildSrc/src/main/java, plain Java without the Gradle API) is compiled by buildSrc's own build, and
// GpuHipToolkitTest verifies the exact HIP command lines and output texts the kernel build tasks run with.
// Gradle does not expose buildSrc output as a project dependency, so this one path names it: the test
// source set carries the classes, and compileTestJava and Test take their classpaths from that source set.
def gpuHipToolkitClasses = files('buildSrc/build/classes/java/main')
sourceSets {
    test {
        compileClasspath = sourceSets.main.output.classesDirs + configurations.testCompileClasspath + gpuHipToolkitClasses
        runtimeClasspath += gpuHipToolkitClasses
    }
}

// The Vector API SIMD kernels (CpuSimd / SimdKernels): compiled to Java 17 bytecode against the incubator
// module of the running JDK and packed into the plain jar. The classes are loaded reflectively only, so a
// Java 11 runtime never links them (the discovery falls back to the scalar kernels), and an older Gradle JVM
// skips the source set entirely. --release cannot compile the incubator API (it is not part of any historical
// platform), so this one compile uses -source/-target instead.
def vectorUsable = JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)

sourceSets {
    vector {
        java.srcDirs = vectorUsable ? ['src/vector/java'] : []
    }
}

if (vectorUsable) {
    sourceSets.vector.compileClasspath = sourceSets.main.output.classesDirs + configurations.compileClasspath

    // the kernels ride with every application run and test of this project (the test JVM must resolve the
    // incubator module for CpuSimd to find them; without the flag the scalar kernels run)
    sourceSets.main.runtimeClasspath += sourceSets.vector.output
    tasks.withType(Test).configureEach {
        classpath += sourceSets.vector.output
        jvmArgs '--add-modules=jdk.incubator.vector'
    }
    // Gradle-launched programs (run, runApp, the demos) also resolve the module, so the CPU kernels are active
    // there. The packaged start scripts and java -jar do not pass it, because they may run on Java 11; the
    // launcher adds it by relaunching itself on Java 17 or later (JvmVectorModule).
    tasks.withType(JavaExec).configureEach {
        jvmArgs '--add-modules=jdk.incubator.vector'
    }

    jar {
        from(sourceSets.vector.output)
    }
}

// Host hot-path microbenchmarks (JMH 1.37, src/jmh/java): compiled against the main classes and run by
// `./gradlew jmh -Pjmh.args='<JMH options>'` (e.g. `-Pjmh.args='-f 1 -wi 3 -i 5 Bpe'`); JMH's forks inherit the
// launcher's JVM flags. Neither the benchmarks nor JMH are packaged: the jar holds the main and vector outputs only.
sourceSets {
    jmh {
        java.srcDirs = ['src/jmh/java']
        resources.srcDirs = []
    }
}
sourceSets.jmh.compileClasspath += sourceSets.main.output.classesDirs + configurations.compileClasspath
sourceSets.jmh.runtimeClasspath += sourceSets.main.runtimeClasspath
if (vectorUsable) {
    sourceSets.jmh.runtimeClasspath += sourceSets.vector.output
}
dependencies {
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Runs the JMH microbenchmarks of src/jmh/java; -Pjmh.args passes JMH options and filters.'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    def jmhArgs = project.findProperty('jmh.args')
    if (jmhArgs != null) {
        args jmhArgs.toString().trim().split(/\s+/).findAll { !it.isEmpty() }
    }
}

// The server module's tests reuse the core test fixtures (SyntheticModels and friends) without publishing them.
configurations {
    testOutput
}
dependencies {
    testOutput sourceSets.test.output
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

if (vectorUsable) {
    // after the release = 11 rule above, so this compile's own toolchain options win
    tasks.named('compileVectorJava', JavaCompile).configure {
        options.release.set(null)
        sourceCompatibility = '17'
        targetCompatibility = '17'
        options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
    }
}

// Every application run forwards neuralfree.* system properties (-D) and project properties (-P) to the JVM, and
// logs through src/main/config/log4j2.xml (INFO and above to standard error).
tasks.withType(JavaExec).configureEach {
    systemProperty 'log4j2.configurationFile', layout.projectDirectory.file('src/main/config/log4j2.xml').asFile.absolutePath
    systemProperties System.properties.findAll { it.key.startsWith('neuralfree.') }
    project.properties.findAll { it.key.startsWith('neuralfree.') }.each { k, v ->
        systemProperty k, v
    }
}

// The opt-in measurement tests read neuralfree.test.* system properties; Gradle does not forward them to test JVMs.
// Uploading real-model weights to a device stages them through direct buffers, so the run that turns the
// measurement on also widens the direct-memory ceiling its model loads need.
def measureProperties = System.properties.findAll { it.key.startsWith('neuralfree.test.') }
tasks.withType(Test).configureEach {
    systemProperties measureProperties
    if (measureProperties.get('neuralfree.test.certargmax.measure') == 'true') {
        jvmArgs '-XX:MaxDirectMemorySize=8g', '-Xmx4g'
    }
    if (measureProperties.get('neuralfree.test.smallbatch.measure') == 'true') {
        jvmArgs '-XX:MaxDirectMemorySize=8g', '-Xmx6g'
    }
}

test {
    useJUnit()

    // the tests forward neuralfree.* system properties (-D) like the JavaExec tasks: the opt-in benchmarks and
    // the GPU selectors take theirs from the command line, since the environment rides the daemon
    systemProperties System.properties.findAll { it.key.startsWith('neuralfree.') }

    // StartScriptVectorModuleTest runs the generated start scripts
    dependsOn testStartScripts
    systemProperty 'neuralfree.test.startScripts', layout.buildDirectory.dir('test-start-scripts').get().asFile.absolutePath

    // the worker's default 512 MiB heap caps its direct buffers at the same 512 MiB, and the engine's closed
    // models release their buffers on collection only — one benchmark variant's tail outran the default, and the
    // OpenCL host paths of the 4B benchmark pair hold more pinned copies than the CUDA ones
    jvmArgs '-XX:MaxDirectMemorySize=1g', '-Xmx2g'

    // The doc-drift tests under gguf.mm read these files directly; declaring them reruns the tests when a doc
    // changes, so a stale Contents list cannot pass on an up-to-date build.
    inputs.files(file('USAGE.md'), file('README.md'), file('LLM-INFERENCE.md'))

    testLogging {
        events = ["passed", "skipped", "failed"]
        exceptionFormat = "full"
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }

    reports {
        html.required = true
        junitXml.required = true
    }

    ignoreFailures = false
}

// The run tasks pass --add-opens java.base/java.util so that abacus-util can read java.util.ArrayList internals (its
// fast path; without the flag abacus-util falls back quietly).
task runApp(type: JavaExec) {
    description = 'Runs NeuralFree.main: creates the training backend and checks a buffer round trip'
    group = 'application'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.eonmux.neuralfree.NeuralFree'

    jvmArgs '-Xmx4096m', '--add-opens=java.base/java.util=ALL-UNNAMED'
}

task runLLMDemo(type: JavaExec) {
    description = 'Runs LLM inference on a GGUF model or Hugging Face checkpoint'
    group = 'application'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.eonmux.neuralfree.demo.LLMDemo'

    def heapMb = project.hasProperty('heap') ? project.property('heap') : '8192'
    jvmArgs "-Xmx${heapMb}m", '--add-opens=java.base/java.util=ALL-UNNAMED'
    // Keeps the temporary files of the OpenCL compiler and the CUDA JIT cache under build/tmp.
    def tmpDir = layout.buildDirectory.dir('tmp').get().asFile
    jvmArgs "-Djava.io.tmpdir=${tmpDir.absolutePath}"
    environment 'TMPDIR', tmpDir.absolutePath
    environment 'CUDA_CACHE_PATH', tmpDir.absolutePath
    doFirst {
        tmpDir.mkdirs()
    }

    if (project.hasProperty('args')) {
        // Parse args respecting quoted strings (single or double quotes)
        def parsed = []
        def matcher = (project.args =~ /(?:"([^"]*)")|(?:'([^']*)')|(\S+)/)
        while (matcher.find()) {
            parsed << (matcher.group(1) ?: matcher.group(2) ?: matcher.group(3))
        }
        args parsed
    }
}

