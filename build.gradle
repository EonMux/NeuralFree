// The application plugin's run task is the multi-call launcher (the same main the start scripts
// run): -Pargs forwards its arguments with the quoting runLLMDemo and runNfTool use, and the
// project version rides in as the version property the manifest carries in the packaged jar.
run {
    description = 'Runs the neuralfree multi-call launcher'
    jvmArgs '-Xmx4096m', '--add-opens=java.base/java.util=ALL-UNNAMED'
    systemProperty 'neuralfree.version', project.version
    if (project.hasProperty('args')) {
        // Parse args respecting quoted strings (single or double quotes), as runNfTool does
        def parsed = []
        def matcher = (project.args =~ /(?:"([^"]*)")|(?:'([^']*)')|(\S+)/)
        while (matcher.find()) {
            parsed << (matcher.group(1) ?: matcher.group(2) ?: matcher.group(3))
        }
        args parsed
    }
}

task runDemos(type: JavaExec) {
    description = 'Runs the NeuralFree demo suite'
    group = 'application'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.eonmux.neuralfree.demo.DemoRunner'

    jvmArgs '-Xmx4096m', '--add-opens=java.base/java.util=ALL-UNNAMED'
}

// The jar is the multi-call entry point ('java -jar' routes like the start scripts do) and carries
// the licence, the notices and the commercial licence summary under META-INF; the manifest's
// Implementation-Version is the version '--version' prints when no property overrides it.
jar {
    manifest {
        attributes('Main-Class': 'com.eonmux.neuralfree.cli.Launcher',
                   'Implementation-Title': 'NeuralFree',
                   'Implementation-Version': project.version)
    }
    from(rootDir) {
        include 'LICENSE', 'NOTICE', 'THIRD-PARTY-NOTICES.md', 'COMMERCIAL-LICENSE.md'
        into 'META-INF'
    }
}

apply from: 'gradle/gpu-kernels.gradle'
apply from: 'gradle/hf-tables.gradle'
apply from: 'gradle/vllm-tables.gradle'

// GPU kernel artifacts are generated under build/generated/gpu and merged here; GLSL sources, shared GLSL
// includes and the shader variant tables of every kernel library are build inputs only. The OpenCL kernel
// sources ship, including the shared headers under kernels/common: they are compiled at run time. Each
// library's kernel inventory kernels/<lib>/inventory.txt is a checked-in resource; inventoryCheck verifies
// it against the kernel sources before it is packaged.
tasks.named('processResources', ProcessResources) {
    from(tasks.named('compileShaders'))
    from(tasks.named('compileTestShaders'))
    from(tasks.named('compileCudaKernels'))
    from(tasks.named('compileHipKernels'))
    from(tasks.named('compileMetalShaders'))
    dependsOn 'inventoryCheck'
    mustRunAfter 'updateKernelInventory'
    exclude 'shaders/**/*.comp', '**/*.glsl', 'shaders/*/variants/**'
}
