task runNfTool(type: JavaExec) {
    description = 'Runs the nftool CLI (export, and the tools of the later tool work packages)'
    group = 'application'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.eonmux.neuralfree.demo.tools.NfTool'

    jvmArgs '-Xmx4096m', '--add-opens=java.base/java.util=ALL-UNNAMED'
    if (project.hasProperty('args')) {
        // Parse args respecting quoted strings (single or double quotes), as runLLMDemo does
        def parsed = []
