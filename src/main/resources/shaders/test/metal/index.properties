# Metal test shaders: one MSL file per kernel, read by MetalKernelLibrary.
# <name>.buffers = buffer argument count, <name>.ro = read-only flags in buffer order,
# <name>.push = scalar argument kinds in order (i int32, u uint32, f float32).
increment.buffers=1
increment.ro=0
increment.push=u

scale.buffers=1
scale.ro=0
scale.push=f,u

simple_add.buffers=3
simple_add.ro=110
simple_add.push=u

matmul.buffers=3
matmul.ro=110
matmul.push=u,u,u
