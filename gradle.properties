org.gradle.warning.mode=all
# Reuse GPU kernel artifacts (CUDA fatbins/PTX, HIP code objects, Vulkan SPIR-V, the HIP shim) and every other
# cacheable task output from a previous build elsewhere on this machine; see gradle/gpu-kernels.gradle.
org.gradle.caching=true
# The Gradle daemon compiles the project's Java in-process; the 512 MiB default heap thrashes the collector on a full
# compile, so the daemon gets room for the main, test and server source sets.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
